<!doctype html>
<html lang="sr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505"><meta name="description" content="ROLL BAR vaučer — proveri i iskoristi svoj vaučer.">
<title>ROLL BAR — Vaučer</title><link rel="stylesheet" href="style.css">
</head>
<body><div class="app">
<header class="topbar"><div class="brand">ROLL <span>BAR</span></div><button id="adminBtn" class="ghost-btn" type="button">ADMIN</button></header>
<main>
<section class="hero"><p class="eyebrow">FAST FOOD · PANČEVO</p><h1>ROLL BAR<br><span>VAUČER</span></h1><p class="lead">Unesi kod vaučera i proveri njegov status.</p>
<div class="search-card"><label for="voucherCode">KOD VAUČERA</label><div class="code-row"><input id="voucherCode" autocomplete="off" autocapitalize="characters" maxlength="32" placeholder="ROLL-XXXXXX"><button id="checkBtn" class="primary-btn" type="button">PROVERI</button></div><p id="message" class="message" aria-live="polite"></p></div></section>
<section id="voucherResult" class="voucher-wrap hidden"><div class="voucher"><div class="voucher-head"><span>ROLL BAR</span><strong>VAUČER</strong></div><div class="voucher-body"><p class="status-label">STATUS</p><h2 id="resultStatus">—</h2><p id="resultTitle" class="reward">—</p><div class="details"><div><small>KOD</small><b id="resultCode">—</b></div><div><small>VREDI DO</small><b id="resultExpiry">—</b></div></div><div id="qr" class="qr"></div></div><div class="voucher-foot">KARADJORDJEVA 1 · PANČEVO</div></div></section>
<section id="adminPanel" class="admin hidden"><div class="section-title"><p class="eyebrow">INTERNAL</p><h2>Upravljanje vaučerima</h2></div><div class="admin-grid">
<div class="panel"><label for="reward">POGODNOST</label><input id="reward" placeholder="Npr. Besplatna porcija pomfrita"><label for="days">VAŽI DANA</label><input id="days" type="number" min="1" max="3650" value="30"><button id="createBtn" class="primary-btn full" type="button">KREIRAJ VAUČER</button><div id="created" class="created hidden"></div></div>
<div class="panel"><div class="panel-head"><h3>Vaučeri</h3><button id="clearBtn" class="text-btn" type="button">OBRIŠI LOKALNE</button></div><div id="voucherList" class="voucher-list"></div></div>
</div></section></main><footer>ROLL BAR · KUCNA DOSTAVA!!</footer></div>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.4/build/qrcode.min.js"></script><script src="app.js"></script>
</body></html>
